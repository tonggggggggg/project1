<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹打磚塊 - 多關卡破關版</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🎮 霓虹打磚塊：破關挑戰</h1>
    <div class="info-bar">
        <span>關卡：<span id="level">1</span> / 3</span>
        <span>分數：<span id="score">0</span></span>
        <span>生命：<span id="lives">3</span></span>
    </div>
    <canvas id="gameCanvas" width="480" height="380"></canvas>
    <p class="controls-hint">
        操作：滑鼠移動 或 方向鍵「← / →」｜道具：[寬] 擋板加長、[命] 生命+1、[火] 穿透火球
    </p>
    <button id="actionBtn" onclick="handleBtnClick()">下一關</button>
    <script src="script.js" defer></script>
</body>
</html>
